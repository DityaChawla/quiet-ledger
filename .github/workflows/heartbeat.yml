# Keeps the free Supabase project awake (it pauses after 7 idle days).
# Set repo secrets SUPABASE_URL and SUPABASE_ANON_KEY, then this pings
# the DB every 3 days. A family using the app most days rarely needs
# it, but it's free insurance.
name: supabase-heartbeat
on:
  schedule: [{ cron: "0 6 */3 * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping database
        run: |
          curl -s "$SUPABASE_URL/rest/v1/spaces?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" > /dev/null
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
